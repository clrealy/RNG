[package]
name = "rng"
version = "0.1.0"
edition = "2021"
description = "RNG's Not GNU!!! — a from-scratch remake of the GNU userland in Rust"
license-file = "License.txt"
readme = "README.md"
repository = "https://github.com/clrealy/RNG"

[[bin]]
name = "rng"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
